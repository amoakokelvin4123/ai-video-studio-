services:
  - type: web
    name: ai-video-studio
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUNWAY_MODEL
        value: gen4.5
      - key: APP_STARTER_CREDITS
        value: "120"
      - key: APP_CREDITS_PER_SECOND
        value: "12"
      - key: SESSION_SECRET
        generateValue: true
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-video-db
          property: connectionString

databases:
  - name: ai-video-db
    plan: free
    region: oregon
